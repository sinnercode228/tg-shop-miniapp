[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tgshop"
version = "1.0.0"
description = "Telegram bot + REST API backend for the Zernolist Mini App shop (demo project)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sinnercode228" }]
dependencies = [
  "aiogram>=3.20,<4",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
tgshop = "tgshop.__main__:main"

[tool.setuptools.packages.find]
include = ["tgshop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["tgshop"]
omit = ["tgshop/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "RET", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["tgshop"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
